<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英文期末複習 · Units 12–14</title>
<style>
  :root{
    --bg:#0f1226; --bg2:#171a37; --card:#1e2247; --card2:#252a55;
    --accent:#6c8cff; --accent2:#9b6cff; --good:#3ddc97; --warn:#ffcc66;
    --text:#eef1ff; --muted:#9aa3cf; --line:#2c326a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Segoe UI","Microsoft JhengHei",system-ui,sans-serif;
    background:linear-gradient(160deg,var(--bg),#0a0c1c 70%);
    color:var(--text); min-height:100vh; padding-bottom:60px;
  }
  header{
    position:sticky; top:0; z-index:50;
    background:rgba(15,18,38,.85); backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line); padding:18px 20px 14px;
  }
  h1{font-size:1.5rem; display:flex; align-items:center; gap:10px}
  h1 .emoji{font-size:1.7rem}
  .sub{color:var(--muted); font-size:.85rem; margin-top:4px}
  .controls{display:flex; flex-wrap:wrap; gap:10px; margin-top:14px; align-items:center}
  .search{
    flex:1; min-width:200px; background:var(--card); border:1px solid var(--line);
    color:var(--text); padding:10px 14px; border-radius:12px; font-size:.95rem;
  }
  .search:focus{outline:none; border-color:var(--accent)}
  .tabs{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px}
  .tab,.mode-btn{
    background:var(--card); border:1px solid var(--line); color:var(--muted);
    padding:8px 16px; border-radius:999px; cursor:pointer; font-size:.9rem;
    transition:.2s; font-weight:600;
  }
  .tab:hover,.mode-btn:hover{border-color:var(--accent); color:var(--text)}
  .tab.active{background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; border-color:transparent}
  .mode-btn.active{background:var(--good); color:#06291c; border-color:transparent}
  .modes{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; align-items:center}
  .modes .label{color:var(--muted); font-size:.85rem; margin-right:4px}
  main{max-width:1100px; margin:0 auto; padding:22px 18px}
  .count{color:var(--muted); font-size:.85rem; margin:6px 2px 16px}
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(310px,1fr)); gap:16px}
  .card{
    background:linear-gradient(155deg,var(--card),var(--card2));
    border:1px solid var(--line); border-radius:16px; padding:18px 18px 16px;
    transition:.2s; position:relative; overflow:hidden;
  }
  .card:hover{transform:translateY(-3px); border-color:var(--accent); box-shadow:0 10px 30px rgba(108,140,255,.18)}
  .card .unit-badge{
    position:absolute; top:14px; right:14px; font-size:.68rem; color:var(--muted);
    background:rgba(108,140,255,.12); padding:3px 9px; border-radius:999px; border:1px solid var(--line);
  }
  .word{font-size:1.25rem; font-weight:700; color:#fff; padding-right:60px}
  .pos{color:var(--accent); font-size:.8rem; font-weight:600; margin-top:2px}
  .mean{color:var(--text); margin-top:10px; font-size:.96rem; line-height:1.5}
  .ex{
    margin-top:12px; padding-top:12px; border-top:1px dashed var(--line);
    font-size:.9rem; line-height:1.6;
  }
  .ex .en{color:#dfe5ff}
  .ex .en b{color:var(--warn); font-weight:700}
  .ex .zh{color:var(--muted); margin-top:4px}
  .ex-label{font-size:.7rem; color:var(--good); font-weight:700; letter-spacing:.5px; display:block; margin-bottom:4px}
  /* flashcard mode */
  body.flash .mean,body.flash .ex{display:none}
  body.flash .card{cursor:pointer}
  body.flash .card.revealed .mean,body.flash .card.revealed .ex{display:block}
  body.flash .card::after{
    content:"👆 點擊看解釋與例句"; position:absolute; bottom:14px; left:18px;
    color:var(--muted); font-size:.78rem;
  }
  body.flash .card.revealed::after{display:none}
  .empty{text-align:center; color:var(--muted); padding:60px 20px; font-size:1rem}
  /* quiz */
  #quiz{max-width:620px; margin:10px auto}
  .quiz-box{background:linear-gradient(155deg,var(--card),var(--card2)); border:1px solid var(--line); border-radius:18px; padding:26px}
  .quiz-q{font-size:1.15rem; margin-bottom:6px}
  .quiz-q b{color:var(--warn)}
  .quiz-hint{color:var(--muted); font-size:.85rem; margin-bottom:18px}
  .opt{
    display:block; width:100%; text-align:left; background:var(--bg2); border:1px solid var(--line);
    color:var(--text); padding:13px 16px; border-radius:12px; margin-bottom:10px; cursor:pointer;
    font-size:.95rem; transition:.15s;
  }
  .opt:hover{border-color:var(--accent)}
  .opt.correct{background:rgba(61,220,151,.18); border-color:var(--good); color:var(--good)}
  .opt.wrong{background:rgba(255,90,90,.15); border-color:#ff6b6b; color:#ff9b9b}
  .quiz-foot{display:flex; justify-content:space-between; align-items:center; margin-top:14px}
  .score{color:var(--muted); font-size:.9rem}
  .next-btn{background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; border:none; padding:10px 22px; border-radius:12px; cursor:pointer; font-weight:600; font-size:.92rem}
  .next-btn:hover{opacity:.9}
  .hidden{display:none !important}
  footer{text-align:center; color:var(--muted); font-size:.8rem; margin-top:40px; padding:0 20px}
</style>
</head>
<body>
<header>
  <h1><span class="emoji">📚</span>英文期末複習 · Data / Culture / Performance</h1>
  <div class="sub">Units 12–14 · 點單元切換，附中英例句、單字卡與小測驗 — 加油！💪</div>
  <div class="controls">
    <input class="search" id="search" placeholder="🔍 搜尋單字、中文意思或例句…">
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="modes">
    <span class="label">模式：</span>
    <button class="mode-btn active" data-mode="list">📖 瀏覽</button>
    <button class="mode-btn" data-mode="flash">🃏 單字卡</button>
    <button class="mode-btn" data-mode="quiz">📝 小測驗</button>
  </div>
</header>

<main>
  <div class="count" id="count"></div>
  <div class="grid" id="grid"></div>
  <div id="quiz" class="hidden"></div>
</main>

<footer>做得好就多看幾次，看膩了就玩單字卡或測驗換換腦袋 ✨ · 共 <span id="total"></span> 個單字</footer>

{u:14,w:"phrase",pos:"v.",m:"以特定言辭表達、措辭",en:"Try to <b>phrase</b> your criticism in a positive way.",zh:"試著用正面的方式來措辭你的批評。"},
{u:14,w:"partition",pos:"n.",m:"隔板、隔間牆",en:"A glass <b>partition</b> divides the office into two areas.",zh:"一道玻璃隔板把辦公室分成兩個區域。"},
{u:14,w:"neutrality",pos:"n.",m:"中立、中立狀態",en:"The mediator kept strict <b>neutrality</b> during the dispute.",zh:"調解人在爭議中保持嚴格的中立。"},
];

/* ---------- render ---------- */
const grid=document.getElementById('grid');
const quizEl=document.getElementById('quiz');
const tabsEl=document.getElementById('tabs');
const countEl=document.getElementById('count');
const searchEl=document.getElementById('search');
document.getElementById('total').textContent=DATA.length;

const UNITS=[{u:'all',n:'全部'},{u:12,n:'U12 Data 數據'},{u:13,n:'U13 Culture 文化'},{u:14,n:'U14 Performance 績效'}];
let curUnit='all', curMode='list';

UNITS.forEach((t,i)=>{
  const b=document.createElement('button');
  b.className='tab'+(i===0?' active':''); b.textContent=t.n; b.dataset.u=t.u;
  b.onclick=()=>{curUnit=t.u; document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active')); b.classList.add('active'); render();};
  tabsEl.appendChild(b);
});

document.querySelectorAll('.mode-btn').forEach(b=>{
  b.onclick=()=>{
    curMode=b.dataset.mode;
    document.querySelectorAll('.mode-btn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    document.body.classList.toggle('flash',curMode==='flash');
    if(curMode==='quiz'){grid.classList.add('hidden'); quizEl.classList.remove('hidden'); startQuiz();}
    else{grid.classList.remove('hidden'); quizEl.classList.add('hidden'); render();}
  };
});

function filtered(){
  const q=searchEl.value.trim().toLowerCase();
  return DATA.filter(d=>{
    if(curUnit!=='all' && d.u!=curUnit) return false;
    if(!q) return true;
    return (d.w+d.m+d.en+d.zh).toLowerCase().includes(q);
  });
}

function render(){
  const list=filtered();
  countEl.textContent=`顯示 ${list.length} 個單字`+(curMode==='flash'?' · 🃏 單字卡模式：先想答案，再點卡片揭曉':'');
  grid.innerHTML='';
  if(!list.length){grid.innerHTML='<div class="empty">😶 找不到符合的單字，換個關鍵字試試。</div>';return;}
  list.forEach(d=>{
    const c=document.createElement('div');
    c.className='card';
    c.innerHTML=`
      <span class="unit-badge">U${d.u}</span>
      <div class="word">${d.w}</div>
      <div class="pos">${d.pos}</div>
      <div class="mean">${d.m}</div>
      <div class="ex"><span class="ex-label">✍️ 例句</span>
        <div class="en">${d.en}</div>
        <div class="zh">${d.zh}</div>
      </div>`;
    if(curMode==='flash') c.onclick=()=>c.classList.toggle('revealed');
    grid.appendChild(c);
  });
}

/* ---------- quiz ---------- */
let qPool=[], qIndex=0, qScore=0, qTotal=0;
function startQuiz(){
  qPool=filtered().slice();
  if(qPool.length<4){
    quizEl.innerHTML='<div class="quiz-box"><div class="quiz-q">這個範圍的單字太少，無法出題 🙈</div><div class="quiz-hint">請切換到「全部」或單一單元（至少需要 4 個單字）。</div></div>';
    return;
  }
  qPool=shuffle(qPool); qIndex=0; qScore=0; qTotal=0;
  showQuestion();
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function showQuestion(){
  if(qIndex>=qPool.length) qPool=shuffle(qPool), qIndex=0;
  const correct=qPool[qIndex];
  const wrongs=shuffle(DATA.filter(d=>d.w!==correct.w)).slice(0,3);
  const opts=shuffle([correct,...wrongs]);
  quizEl.innerHTML=`
    <div class="quiz-box">
      <div class="quiz-q">這個字的意思是？ <b>${correct.w}</b> <span style="color:var(--muted);font-size:.85rem">(${correct.pos})</span></div>
      <div class="quiz-hint">U${correct.u} · 選出正確的中文意思</div>
      <div id="opts"></div>
      <div class="quiz-foot">
        <span class="score">得分：${qScore} / ${qTotal}</span>
        <button class="next-btn hidden" id="next">下一題 →</button>
      </div>
    </div>`;
  const optsBox=document.getElementById('opts');
  opts.forEach(o=>{
    const b=document.createElement('button');
    b.className='opt'; b.textContent=o.m;
    b.onclick=()=>{
      if(optsBox.dataset.done) return;
      optsBox.dataset.done='1'; qTotal++;
      if(o.w===correct.w){b.classList.add('correct'); qScore++;}
      else{b.classList.add('wrong');
        [...optsBox.children].forEach(x=>{if(x.textContent===correct.m)x.classList.add('correct');});}
      document.querySelector('.score').textContent=`得分：${qScore} / ${qTotal}`;
      document.getElementById('next').classList.remove('hidden');
    };
    optsBox.appendChild(b);
  });
  document.getElementById('next').onclick=()=>{qIndex++; showQuestion();};
}

searchEl.oninput=()=>{ if(curMode==='quiz') startQuiz(); else render(); };
render();
</script>
</body>
